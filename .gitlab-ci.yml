include:
  - project: shared/devops-toolkit
    ref: main
    file:
      - /gitlab-ci/build_deploy/nodejs-monorepo.yml

stages:
  - docker_build
  - deploy_trigger

workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /(\[skip ci\]|\[ci skip\])/i'
      when: never
    - when: always

# ----------------------------
# 版本(release/*)與 npm 發佈(publish/npmjs)都由 GitHub Actions 處理:
#   - cd-version-release*.yml  → changeset version
#   - cd-publish-npmjs.yml     → changeset publish
# GitLab 只負責 deploy(deploy/dev)。bridge 只對 deploy/* 觸發,其餘 mirror-only。
# ----------------------------

# 1. 執行偵測：產出 dynamic-apps-pipeline.yml
detect_project:
  stage: deploy_trigger
  extends: .build_deploy:detect
  variables:
    DEPLOY_NAMESPACE: "rfjs-dev"
    DEPLOY_ENV: "royfw-dev"
  artifacts:
    paths:
      - dynamic-deploy-pipeline.yml
      - .deploy/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/dev"'
      variables:
        KUBECONFIG: ${ROYFW_KUBECONFIG}

# 2. 觸發動態產生的 Jobs (Child Pipeline)
trigger_project:
  stage: deploy_trigger
  needs: [detect_project]
  extends: .build_deploy:trigger
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/dev"'
      variables:
        KUBECONFIG: ${ROYFW_KUBECONFIG}
