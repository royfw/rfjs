name: Deploy

on:
  push:
    branches:
      - main
      - release/*
      - deploy/*
      - publish/*

# One in-flight run per branch so two pushes don't race the same GitLab branch
# (force_push keeps the GitLab branch identical to GitHub).
concurrency:
  group: gitlab-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for a faithful mirror push

      - name: Sync to GitLab
        id: sync
        uses: royfw/gitlab-sync-action@v1
        with:
          gitlab_push_host: ${{ secrets.GITLAB_PUSH_HOST }}
          gitlab_project_path: royfw/apps/rfjs
          gitlab_project_id: 5
          gitlab_ref: ${{ github.ref_name }}
          deploy_env: royfw-dev
          # Only publish/* and deploy/* have matching jobs in .gitlab-ci.yml.
          # main is the mirror, and release/* is versioned by GitHub Actions
          # (cd-version-release*.yml) — GitLab has no job for either, so triggering
          # a pipeline there returns 400 "No stages / jobs". Mirror-only on
          # main + release/*; trigger + wait on publish/* and deploy/*.
          trigger_pipeline: ${{ startsWith(github.ref_name, 'publish/') || startsWith(github.ref_name, 'deploy/') }}
          wait_for_pipeline: ${{ startsWith(github.ref_name, 'publish/') || startsWith(github.ref_name, 'deploy/') }}
          gitlab_push_token: ${{ secrets.GITLAB_API_TOKEN }}
          gitlab_trigger_token: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          gitlab_api_token: ${{ secrets.GITLAB_API_TOKEN }}

      - name: Display Pipeline Info
        run: |
          echo "Pipeline ID: ${{ steps.sync.outputs.pipeline_id }}"
          echo "Pipeline Status: ${{ steps.sync.outputs.pipeline_status }}"
          echo "Pipeline URL: ${{ steps.sync.outputs.pipeline_web_url }}"

      - name: Deploy if Pipeline Succeeded
        if: steps.sync.outputs.pipeline_status == 'success'
        run: |
          echo "Pipeline succeeded! Proceeding with deployment..."
